"GRID LEFT/RIGHT" = ["Grid ◀ ▶", "Move / rotate pattern", "SHIFT: fine nudge", "ALT: halve / double length"]
"MUTE 1" = ["Select", "SHIFT: Mute pad mode"]
"MUTE 2" = ["Last step", "SHIFT: Solo pad mode"]
"MUTE 3" = ["Copy / paste"]
"MUTE 4" = ["Delete / reset"]
"DRUM" = ["DRUM", "again: Nested Rhythm"]
"STEP" = ["STEP", "Poly Step", "SHIFT: latch accent", "ALT: fill"]
"TRANSPORT" = ["Transport", "REC: launcher overdub"]

[[mode]]
key = "launcher"
title = "Launcher"
guide = "Launcher mode (`PERFORM`)"
entry = "PERFORM"
how = "Press `PERFORM`."
intro = "A 16 × 4 clip launcher. Filled slots select and launch from the clip start; empty slots create a clip of `Default Clip Length` and launch it."
encoders = [
  ["Global remote 1", "Track volume", "Track remote 1", "Device remote 1"],
  ["Global remote 2", "Track pan", "Track remote 2", "Device remote 2"],
  ["Global remote 3", "Send 1", "Track remote 3", "Device remote 3"],
  ["Global remote 4", "Send 2", "Track remote 4", "Device remote 4"],
]
pads = [
  { rows = [1, 2, 3, 4], lines = ["Clip slots", "press: select + launch", "empty: new clip"] },
]
notes = [
  "`SHIFT + PERFORM` latches the Mix page: rows select, solo, mute, and arm the 16 visible tracks. `PATTERN DOWN` there steps into device view and device layers.",
  "`PERFORM` again shows the Scene Launch page: the top row launches the 16 visible scenes. `SHIFT + ALT + PERFORM` opens Birds-Eye navigation for large sets.",
  "On remote encoder pages, hold `ALT` while turning for remotes 5–8.",
  "`Perform Clip Launcher Layout` sets whether the launcher starts vertical or horizontal; `ALT + PERFORM` toggles it for the session.",
]

[mode.controls]
