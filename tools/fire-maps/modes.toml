[[mode]]
key = "fugue"
title = "Fugue"
guide = "Fugue mode"
entry = "STEP"
how = "Press `STEP` three times: Poly Step, Melo Gen, then Fugue."
intro = "MIDI channel 1 is the source line; Fugue generates related lines on channels 2–4. The encoders follow the active line, chosen with `KNOB MODE`."
pages = ["SRC", "2–4", "HELD"]
encoders = [
  ["Shared root", "Direction", "Velocity"],
  ["Shared scale", "Tempo", "Chance"],
  ["Clip length", "Start", "Gate"],
  ["Play start", "Interval", "Pitch"],
]
pads = [
  { rows = [1], lines = ["Source line", "channel 1", "tap: add / remove note"] },
  { rows = [2, 3, 4], lines = ["Derived lines 2–4", "press: select line", "and set its start"] },
]
notes = [
  "Encoder lines: `SRC` with the source line active, `2–4` with a derived line active, `HELD` while holding a source pad. `ALT` on the source gives velocity, chance, and gate; on derived lines it gives velocity, chance, gate, and octave jump.",
  "Turning an encoder on a derived line rebuilds that line at once.",
  "Existing notes on channels 2–4 are protected; press `PATTERN DOWN` to replace them. After editing channel 1 in Bitwig, press `PATTERN DOWN` to rebuild.",
]

[mode.controls]
