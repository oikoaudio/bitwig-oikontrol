[[mode]]
key = "nested-rhythm"
title = "Nested Rhythm"
guide = "Nested Rhythm mode"
entry = "DRUM"
how = "Press `DRUM` twice: Drum XOX, then Nested Rhythm."
intro = "Generates rhythm from nested divisions (tuplets, ratchets, asymmetric subdivisions) with exact timing, and shows the hits on the pads. It never overwrites an existing clip until you press `PATTERN DOWN`."
encoders = [
  ["Density", "Volume", "Velocity spread", "Linear pitch"],
  ["Tuplet", "Pan", "Pressure spread", "Pitch expr spread"],
  ["Ratchet", "Send 1", "Timbre spread", "Clip length"],
  ["Cluster", "Send 2", "Chance", "Reset hit edits"],
]
pads = [
  { rows = [1], lines = ["Clip slots", "hold hit: recurrence mask"] },
  { rows = [2, 3], lines = ["Projected rhythm", "32 bins", "hold: grab nearest hit"] },
  { rows = [4], lines = ["Hits 1–16", "tap: toggle hit", "SHIFT: reset hit"] },
]
notes = [
  "`Channel` changes the generator structure. `ALT` gives density direction, tuplet and ratchet divisions (`x2`–`x16`), and play start; `SHIFT` gives recurrence, target phase, and rate.",
  "On `User 1` and `User 2`, `ALT` sets the center and `SHIFT` rotates the contour. Hold a hit pad and turn an expression encoder to edit that hit.",
  "Timing is not edited from the pads: they are a projection of the generated notes, not Bitwig's note grid.",
]

[mode.controls]
"KNOB MODE" = ["Encoder page", "CH · MX · U1 · U2"]
