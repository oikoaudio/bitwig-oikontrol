# Akai Fire mode maps: what each control does, per mode. Written from docs/user-guide.md; `guide` names the
# section each mode is taken from. Rendered by make_fire_maps.py.
#
# encoders: four columns (encoder 1-4), each with one label per encoder page: Channel, Mixer, User 1, User 2.
# pages: optional tags for the encoder lines when a mode pages its encoders differently (Fugue).
# controls: callout lines per control. The first line is the title; "TAG: text" renders the tag small.
# pads: regions of whole pad rows, 1 = top row.
# notes: shown under the map. `CONTROL` renders bold.

[[mode]]
key = "note"
title = "Note"
guide = "NOTE mode"
entry = "NOTE"
how = "Press `NOTE`."
intro = "A 16 × 4 playing surface for melodic and harmonic input. Root, scale, and octave are shared with Melo Gen, Poly Step, and the settings overlay."
encoders = [
  ["Mod", "Track volume", "Velocity sens.", "Device remote 1"],
  ["Pitch bend", "Track pan", "Aftertouch", "Device remote 2"],
  ["Pitch gliss", "Send 1", "Breath", "Device remote 3"],
  ["Timbre", "Send 2", "Pitch expression", "Device remote 4"],
]
pads = [
  { rows = [1, 2, 3, 4], lines = ["Note grid", "low notes bottom left", "lit: root, in scale"] },
]
notes = [
  "Press `NOTE` again for harmonic input: a scale-aware lattice where each pad plays a stack. Its `Mixer` page sets notes per pad, octave span, bass grid, and voicing.",
  "`ALT + NOTE` toggles chromatic / in-key in melodic input, and bass columns / full field in harmonic input.",
  "`SHIFT` on `User 1` encoder 1 sets the velocity center. `ALT` on `Channel` encoder 3 changes the gliss mode.",
  "Note Repeat divisions run from `1/32T` to `1/4`; the default is `1/16`.",
]

[mode.controls]
"KNOB MODE" = ["Encoder page", "CH · MX · U1 · U2"]
"PATTERN UP/DOWN" = ["Pattern ▲ ▼", "▲ previous / ▼ next scale", "ALT: ▲ higher / ▼ lower root"]
"SELECT" = ["Select", "hold Repeat + turn: division"]
"GRID LEFT/RIGHT" = ["Grid ◀ ▶", "Octave down / up", "ALT: undo / redo"]
"MUTE 1" = ["Sustain"]
"MUTE 2" = ["Sostenuto"]
"MUTE 3" = ["Note repeat", "hold + SELECT: division"]
"MUTE 4" = ["Hold", "latch pads already down"]
"NOTE" = ["NOTE", "melodic ↔ harmonic", "ALT: layout variant"]
"STEP" = ["STEP", "Poly Step", "SHIFT: Step Input helper"]

[[mode]]
key = "drum-xox"
title = "Drum XOX"
guide = "DRUM Mode"
entry = "DRUM"
how = "Press `DRUM`. Press again for Nested Rhythm, Drum Pads, then Multiclip Seq."
intro = "A step sequencer for a Bitwig Drum Machine: clip slots on top, the visible drum lanes below, and 32 steps for the selected lane."
encoders = [
  ["Note length", "Pad volume", "Velocity", "Pad remote 1"],
  ["Chance", "Pad pan", "Pressure", "Pad remote 2"],
  ["Velocity spread", "Pad send 1", "Timbre", "Pad remote 3"],
