"MUTE 1" = ["Select", "hold + pad: no launch"]
"MUTE 2" = ["Double length", "SHIFT: halve"]
"MUTE 3" = ["Paste", "hold + pad: selected clip"]
"MUTE 4" = ["Delete", "hold + pad"]
"PERFORM" = ["PERFORM", "again: Scene Launch page", "SHIFT: Mix page", "ALT: vertical / horizontal"]
