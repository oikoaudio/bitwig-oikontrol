  { rows = [1], lines = ["Clip slots"] },
  { rows = [2], lines = ["Drum pads", "visible lanes"] },
  { rows = [3, 4], lines = ["Steps 1–32", "selected lane", "hold + STEP: accent"] },
]
notes = [
  "Hold one or more step pads, then use the `GRID` timing gestures to move those notes directly.",
  "Hold `Copy` and press a clip slot, drum pad, or step to paste from the selected item of the same type.",
  "`User 2`: hold `ALT` for remotes 5–8. `ALT + KNOB MODE` cycles Pad Remotes, Drum Machine Remotes, and Euclid.",
  "Encoders 1–3 on `User 1` set the held steps' values, or the defaults for new steps when no step is held.",
]

[mode.controls]
"KNOB MODE" = ["Encoder page", "CH · MX · U1 · U2", "ALT: U2 remote target"]
"PATTERN UP/DOWN" = ["Pattern ▲ ▼", "Page visible steps", "ALT: scroll drum pads"]
